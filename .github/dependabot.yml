version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 2.0 completed the Node 22.19+, TypeScript 7, and Anthropic 1.x migration.
    # Review subsequent breaking toolchain/API upgrades deliberately; patches
    # and minors continue through the grouped maintenance PRs below.
    ignore:
      - dependency-name: "@anthropic-ai/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apidevtools/swagger-parser"
        update-types: ["version-update:semver-major"]
      - dependency-name: commander
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: tsup
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-runtime:
        dependency-type: production
      npm-development:
        dependency-type: development
