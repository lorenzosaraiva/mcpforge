name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.19.0, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate registry
        run: npm run registry:validate

  release-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run release:validate
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:package
      - run: npm run benchmark:contracts
      - name: Preserve deterministic task results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-contract-report
          path: benchmarks/results/contract.json
          if-no-files-found: ignore
