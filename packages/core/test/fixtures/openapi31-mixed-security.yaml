openapi: 3.1.0
info:
  title: Mixed Security Fixture
  version: 1.0.0
servers:
  - url: https://{region}.example.com/v1
    variables:
      region:
        default: eu
components:
  securitySchemes:
    headerKey:
      type: apiKey
      in: header
      name: X-API-Key
    tenantKey:
      type: apiKey
      in: query
      name: tenant_key
security:
  - headerKey: []
paths:
  /public:
    get:
      operationId: getPublic
      security: []
      responses:
        "200":
          description: Public status
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                required: [available]
            text/plain:
              schema:
                type: string
  /combined:
    get:
      operationId: getCombined
      servers:
        - url: https://special.example.com/api
      security:
        - headerKey: []
          tenantKey: []
      responses:
        "204": { description: No content }
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
